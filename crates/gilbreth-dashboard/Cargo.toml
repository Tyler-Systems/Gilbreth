[package]
name = "gilbreth-dashboard"
description = "Native egui dashboard shell (S4): BRAND theme, charts module, Today tab"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
gilbreth-read = { path = "../gilbreth-read" }
raw-window-handle.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# DASH-06 work-area fit: Win32 monitor metrics for the first-launch window.
# Target-gated like gilbreth-capture-windows so non-Windows builds carry no
# Win32 dependency tree.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
egui_kittest.workspace = true
# The shared product-copy style law (Lane B enforcement); tests only —
# the runtime crate keeps its dependency surface unchanged.
gilbreth-core = { path = "../gilbreth-core" }
# Fixture databases with the canonical migrated schema; tests only — the
# runtime crate stays store-free (C3 boundary discipline).
gilbreth-store = { path = "../gilbreth-store" }
tempfile.workspace = true
