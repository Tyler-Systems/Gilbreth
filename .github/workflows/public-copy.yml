# Focused public-document gate. The full native CI workflow deliberately
# ignores prose-only pushes; this lane checks public copy and the links among
# the living maintainer/release documents without spending Rust runners.

name: public-copy

# See ci.yml: one run per ref, and main is never cancelled.
concurrency:
  group: public-copy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    paths:
      - "README.md"
      - "SECURITY.md"
      - "docs/MAINTAINING.md"
      - "docs/RELEASE_PROCESS.md"
      - "docs/VERIFY.md"
      - "docs/ARCHITECTURE.md"
      - "docs/CAPABILITY_MATRIX.md"
      - "scripts/tests/test_copy_style_public_docs.py"
      - "scripts/tests/test_living_document_links.py"
      - "crates/gilbreth-core/src/copy_style.rs"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "SECURITY.md"
      - "docs/MAINTAINING.md"
      - "docs/RELEASE_PROCESS.md"
      - "docs/VERIFY.md"
      - "docs/ARCHITECTURE.md"
      - "docs/CAPABILITY_MATRIX.md"
      - "scripts/tests/test_copy_style_public_docs.py"
      - "scripts/tests/test_living_document_links.py"
      - "crates/gilbreth-core/src/copy_style.rs"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install pytest
        run: python -m pip install --quiet "pytest>=9,<10"
      - name: audit public documents
        run: >-
          python -m pytest
          scripts/tests/test_copy_style_public_docs.py
          scripts/tests/test_living_document_links.py
          -q
