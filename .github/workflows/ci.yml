# Hosted CI mirrors the native-product and scoped operational-tooling gates in
# .githooks/pre-push. Python is used only for repository-local evidence tools;
# the shipping application and native dashboard do not require it.
#
# No secrets, nothing deploys or publishes (per the recorded CI spec; the
# Artifact Signing lane, if it ever lands, is a separate tag-only workflow).
# Linux, Windows, and Apple-silicon macOS run on GitHub-hosted runners for
# non-prose pushes and pull requests. No public workflow may target a
# maintainer-owned machine.
#
# These native lanes ignore prose-only changes. The companion public-copy
# workflow audits the public site and living maintainer/release documents;
# PowerShell scripts are not prose, so retained operational tests exercise them.
#
# Actions are pinned to full commit SHAs (tag in the trailing comment). Bump
# pins deliberately, never by tag drift.

name: ci

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE*"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE*"
  workflow_dispatch: {}

# One run per ref. A superseded push cancels its predecessor instead of both
# running to completion — the earlier result is discarded anyway. `main` is
# excluded from cancellation because its runs are the trunk-green record and
# must not be cancelled by a following push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The full native-product gate on the shipping platform, followed by the
  # scoped operational-Python checks. There is no dashboard parity prebuild.
  windows-gate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: pinned Windows release Rust toolchain
        shell: pwsh
        run: |
          $release = Get-Content -Raw packaging/windows/release-config.json | ConvertFrom-Json
          $toolchain = "$($release.rustRelease)-$($release.rustHost)"
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default $toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy (-D warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked --workspace
      - name: operational Python dependencies
        run: python -m pip install --quiet -r scripts/requirements-dev.txt
      - name: operational Python format
        run: python -m black --check scripts
      - name: operational Python lint
        run: python -m ruff check scripts
      - name: operational Python tests
        run: python -m pytest scripts/tests -q

  # Cheap always-on hygiene at 1x minutes: formatting, the full-workspace
  # clippy/check against the Windows target (mingw supplies the C toolchain
  # bundled SQLite needs), portable-crate tests on Linux, and the portable
  # operational-Python checks. gilbreth-app has no Linux platform backend
  # (by scope), so native Linux work is scoped to the portable crates.
  linux-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: mingw + windows-gnu target
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy, windows-gnu target (-D warnings)
        run: cargo clippy --locked --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - name: portable-crate tests
        run: cargo test --locked -p gilbreth-core -p gilbreth-store -p gilbreth-read
      - name: operational Python checks
        run: |
          python -m pip install --quiet -r scripts/requirements-dev.txt
          python -m black --check scripts
          python -m ruff check scripts
          python -m pytest scripts/tests -q

  # Native Apple-silicon cross-check: the same workspace clippy/tests that
  # previously ran on the development Mac now run on GitHub's hosted arm64
  # macOS image. The linux-hygiene job owns the windows-gnu cross-check.
  #
  # Scoped to main and pull requests. Hosted macOS bills at 10x, which made
  # this ~70% of a full run's cost while being the least load-bearing lane:
  # .githooks/pre-push already runs the identical native darwin gate on the
  # development Mac before anything leaves it, and this lane cannot compare
  # visual baselines at all (hosted GPUs do not match a dev machine's
  # rasterisation, so `CI` skips the comparison). Keeping it on main and PRs
  # preserves the trunk-green record and the review gate; running it on every
  # topic-branch push bought a weaker second opinion at the highest rate.
  macos-target:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: pinned native Rust toolchain
        shell: bash
        run: |
          rust_release="$(python3 -c 'import json; print(json.load(open("packaging/windows/release-config.json", encoding="utf-8"))["rustRelease"])')"
          rustup toolchain install "$rust_release" --profile minimal --component clippy
          rustup default "$rust_release"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo clippy, native darwin (-D warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: native workspace tests
        run: cargo test --locked --workspace
